server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/sentinela;MODE=PostgreSQL;AUTO_SERVER=FALSE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.cookie.http-only=true
server.tomcat.max-http-form-post-size=16KB
server.max-http-request-header-size=16KB
sentinela.demo=${DEMO_MODE:false}
sentinela.secure-cookies=${SECURE_COOKIES:false}
sentinela.encryption-key=${ENCRYPTION_KEY:}
sentinela.allowed-origin=${WEB_ORIGIN:http://localhost:3000}
sentinela.urlhaus-key=${URLHAUS_KEY:}
sentinela.google-key=${GOOGLE_SAFE_BROWSING_KEY:}
sentinela.admin-email=${ADMIN_EMAIL:}
sentinela.admin-password=${ADMIN_PASSWORD:}
sentinela.colab-url=${COLAB_CHAT_URL:}
sentinela.colab-key=${COLAB_CHAT_KEY:}

sentinela.require-mfa=${REQUIRE_MFA:false}
sentinela.monitoring-enabled=${MONITORING_ENABLED:true}
sentinela.telegram-api-key=${TELEGRAM_API_KEY:}
