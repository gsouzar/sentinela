plugins { id 'com.android.application' }
android {
 namespace 'br.edu.sentinela.mobile'
 compileSdk 35
 defaultConfig { applicationId 'br.edu.sentinela.mobile'; minSdk 26; targetSdk 35; versionCode 1; versionName '1.0.0'; buildConfigField 'String', 'API_BASE', '"' + (project.findProperty('apiBase') ?: 'http://10.0.2.2:8080/api/v1') + '"' }
 buildFeatures { buildConfig true }
 buildTypes { release { minifyEnabled false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
